# ==============================================================================
# BANCO XYZ - CONFIGURACION CENTRALIZADA: BFF WEB (Portal Clientes / Ejecutivos)
# ==============================================================================
server.port=8085
spring.application.name=bff-web

# SSL Keystore HTTPS
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=bancoxyz2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bancoxyz

# Comunicacion con Core Bancario
bank.core.url=${BANK_CORE_URL:http://localhost:8081/api/core}
bank.core.internal-api-key=SecretCoreKeyBancoXYZ2026

# Seguridad JWT Canal Web
bank.jwt.secret=BancoXYZSuperSecretKeyClaveSeguraParaTokensJWT2026MovilWebATM
bank.jwt.expiration-ms=86400000

# Registro y Deteccion dinamica en Eureka Discovery Server
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:eureka2026@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Documentacion OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Metricas y Monitoreo Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
