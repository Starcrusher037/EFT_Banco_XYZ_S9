# ==============================================================================
# BANCO XYZ - CONFIGURACION CENTRALIZADA: BATCH SERVICE (Migracion Legacy)
# ==============================================================================
server.port=8086
spring.application.name=batch-service

# Base de datos MySQL para Metadatos Spring Batch y Persistencia
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/bancoxyz?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}
spring.batch.jdbc.initialize-schema=always
spring.sql.init.mode=always
spring.batch.job.enabled=false

# Registro en Eureka Discovery Server
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:eureka2026@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Documentacion OpenAPI / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Metricas y Monitoreo Actuator
management.endpoints.web.exposure.include=health,info,batch
management.endpoint.health.show-details=always

# Logging detallado de ejecuciones batch
logging.level.org.springframework.batch=INFO
logging.level.cl.duoc.bancoxyz.batch=INFO
