server.port=8081
spring.application.name=core-service

# OAuth2 Resource Server (Validacion descentralizada con auth-server)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_SERVER_JWKS_URI:http://localhost:8080/.well-known/jwks.json}

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Configuracion de Pool de Conexiones HikariCP
# maximum-pool-size: Limita el numero maximo de conexiones simultaneas para prevenir saturacion
spring.datasource.hikari.maximum-pool-size=10
# minimum-idle: Mantiene un pool base de conexiones calientes listas para responder con baja latencia
spring.datasource.hikari.minimum-idle=5
# connection-timeout: Tiempo maximo (ms) que un hilo esperara una conexion disponible antes de fallar (20s)
spring.datasource.hikari.connection-timeout=20000
# idle-timeout: Tiempo maximo (ms) que una conexion inactiva permanecera en el pool antes de ser liberada (5m)
spring.datasource.hikari.idle-timeout=300000
# max-lifetime: Tiempo maximo (ms) de vida de una conexion para evitar fugas y sockets obsoletos (20m)
spring.datasource.hikari.max-lifetime=1200000
# pool-name: Nombre descriptivo asignado al pool en logs y metricas JMX/Actuator
spring.datasource.hikari.pool-name=HikariPool-CoreBancario

# JMS / Apache ActiveMQ
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin
spring.activemq.packages.trust-all=true

# ==============================================================================
# Resilience4j Circuit Breaker: envioMensajeria
# Proposito Operativo: Protege las operaciones bancarias del Core aislando fallos
# en la publicacion hacia el broker ActiveMQ. Si el broker experimenta indisponibilidad
# o degradacion (tasa de fallos > 50%), el circuito abre y activa el fallback de
# contingencia local sin abortar ni generar rollback en las transacciones contables.
# ==============================================================================
resilience4j.circuitbreaker.instances.envioMensajeria.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.envioMensajeria.slidingWindowSize=10
resilience4j.circuitbreaker.instances.envioMensajeria.failureRateThreshold=50
resilience4j.circuitbreaker.instances.envioMensajeria.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.envioMensajeria.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.envioMensajeria.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.envioMensajeria.automaticTransitionFromOpenToHalfOpenEnabled=true

# Resilience4j Retry: Politica de reintentos escalonados antes de activar contingencia
resilience4j.retry.instances.envioMensajeria.maxAttempts=3
resilience4j.retry.instances.envioMensajeria.waitDuration=1000

# Actuator Health & Metrics
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.health.circuitbreaker.enabled=true

# Eureka Discovery
eureka.client.service-url.defaultZone=http://eureka:eureka2026@localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true
