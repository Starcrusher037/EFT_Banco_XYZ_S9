# --------------------------------------------------
# Identificacion y puerto
# --------------------------------------------------
spring.application.name=auth_server
server.port=8080

# --------------------------------------------------
# Eureka Discovery Client
# --------------------------------------------------
eureka.client.service-url.defaultZone=http://eureka:eureka2026@localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# --------------------------------------------------
# Actuator
# --------------------------------------------------
management.endpoints.web.exposure.include=health,info,env
management.endpoint.health.show-details=always

# --------------------------------------------------
# OAuth2 Client: GitHub (Parametrizado con Variables de Entorno)
# --------------------------------------------------
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:Ov23lib2ztrqPoxNZEe7}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.client-name=GitHub

# --------------------------------------------------
# Emisor y configuracion JWT
# --------------------------------------------------
ms.auth.jwt.issuer=http://localhost:8080
ms.auth.jwt.expiration-seconds=3600
spring.security.oauth2.authorizationserver.issuer=http://localhost:8080

# --------------------------------------------------
# Logging
# --------------------------------------------------
logging.level.org.springframework.security=INFO
logging.level.org.springframework.security.oauth2=DEBUG
