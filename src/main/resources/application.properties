# =========================================================================
# 1. IDENTIFICACIÓN DE LA APLICACIÓN Y PUERTO SEGURO
# =========================================================================
# Nombre oficial del proyecto para logs y trazabilidad de microservicios
spring.application.name=Exp2_S5_BancoXYZ

# Puerto estándar para conexiones cifradas HTTPS (en lugar del puerto 8080 HTTP no seguro)
server.port=8443

# =========================================================================
# 2. SEGURIDAD HTTPS / TLS (CERTIFICADO DIGITAL PKCS12 BANCO XYZ)
# Cifrado en tránsito obligatorio para proteger datos sensibles en banca
# =========================================================================
# Habilita el protocolo de cifrado SSL/TLS en el servidor web embebido Tomcat
server.ssl.enabled=true

# Ruta del almacén de claves (ubicado en src/main/resources/keystore.p12)
server.ssl.key-store=classpath:keystore.p12

# Contraseña secreta para desbloquear y leer el certificado digital
server.ssl.key-store-password=blanquito123

# Formato estándar de la industria bancaria para almacenar certificados (PKCS#12)
server.ssl.key-store-type=PKCS12

# Alias o etiqueta identificadora del certificado dentro del almacén
server.ssl.key-alias=bancoxyz_cert

# =========================================================================
# 3. CONFIGURACIÓN DE TOKENS JWT DE USUARIO / CLIENTE (FRONTEND -> BFF)
# =========================================================================
# Clave secreta con algoritmo HMAC-SHA256 (mínimo 256 bits / 32 caracteres) para firmar tokens de usuario
jwt.secret=mi-clave-secreta-bancoxyz-2026-para-jwt-1234567890-super-segura

# Tiempo de validez del token de usuario: 3.600.000 ms = 60 minutos (1 hora)
jwt.expiration=3600000

# =========================================================================
# 4. CONFIGURACIÓN DE TOKENS DELEGADOS DE SERVICIO (BFF -> MICROSERVICIOS)
# =========================================================================
# Clave secreta compartida privada entre BFFs y microservicios internos del Core Bancario
jwt.service-secret=clave-compartida-bff-bancoxyz-service-token-2026-1234567890

# Tiempo de validez del token de servicio: 3.000.000 ms = 50 minutos
jwt.service-expiration=3000000

# =========================================================================
# 5. LÍMITES Y PARÁMETROS OPERATIVOS BANCARIOS (CONFIGURACIÓN EXTERNA)
# Permite modificar políticas bancarias sin recompilar el código Java
# =========================================================================
# Límite máximo de giro en cajero automático (en pesos chilenos CLP)
banco.atm.limite-giro=200000

# Múltiplo de dispensación de billetes en cajero automático (denominación mínima $5.000)
banco.atm.multiplo-billete=5000

# Sobregiro por defecto para cuentas corrientes (en pesos chilenos CLP)
banco.cuenta.sobregiro-defecto=300000

# Límite de transacciones en resumen para canal móvil (optimización de ancho de banda)
banco.movil.limite-transacciones-resumen=3

# =========================================================================
# 6. DOCUMENTACIÓN INTERACTIVA OPENAPI / SWAGGER
# =========================================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# =========================================================================
# 7. SERIALIZACIÓN TEMPORAL HOMOGÉNEA (ISO-8601)
# =========================================================================
# Formato estándar y homogéneo de fechas para todas las respuestas JSON (yyyy-MM-dd)
spring.jackson.date-format=yyyy-MM-dd
