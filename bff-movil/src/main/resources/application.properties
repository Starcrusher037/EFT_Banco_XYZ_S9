server.port=8084
spring.application.name=bff-movil

# Importar configuracion desde Config Server (con credenciales)
spring.config.import=optional:configserver:http://admin:gato@localhost:8888
spring.cloud.config.uri=http://localhost:8888
spring.cloud.config.username=admin
spring.cloud.config.password=gato
spring.cloud.config.fail-fast=false

# Configuracion HTTPS / SSL con Certificado Digital
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=bancoxyz2026
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=bancoxyz

# URL del Core Bancario (HTTP interno)
bank.core.url=${BANK_CORE_URL:http://localhost:8081/api/core}
bank.core.internal-api-key=SecretCoreKeyBancoXYZ2026

# JWT Config
bank.jwt.secret=BancoXYZSuperSecretKeyClaveSeguraParaTokensJWT2026MovilWebATM
bank.jwt.expiration-ms=86400000

# Registro en Eureka con credenciales
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka:eureka2026@localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Resilience4j Circuit Breaker Config
resilience4j.circuitbreaker.instances.coreService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.coreService.sliding-window-size=10
resilience4j.circuitbreaker.instances.coreService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.coreService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.coreService.wait-duration-in-open-state=10000ms
resilience4j.circuitbreaker.instances.coreService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.coreService.automatic-transition-from-open-to-half-open-enabled=true

# Resilience4j Retry Config
resilience4j.retry.instances.coreService.max-attempts=3
resilience4j.retry.instances.coreService.wait-duration=1000ms

# Swagger & Actuator
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
