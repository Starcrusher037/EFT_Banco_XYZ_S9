# Puerto estandar de Eureka Server
server.port=8761
spring.application.name=discovery-server

# Configuracion del servidor Eureka: no debe registrarse a si mismo ni buscar registro
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# URL del servidor Eureka para auto-referencia
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Tiempo de espera para sincronizacion inicial
eureka.server.wait-time-in-ms-when-sync-empty=0

# Nivel de logs para monitoreo de registros y heartbeats
logging.level.com.netflix.eureka=DEBUG
logging.level.com.netflix.discovery=DEBUG

# Autenticacion basica para el servidor Eureka (consola web y clientes)
spring.security.user.name=eureka
spring.security.user.password=eureka2026
